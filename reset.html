<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Restableciendo acceso EPOANT</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#061523;color:white;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}
</style>
</head>
<body>
<div>
<h2>Restableciendo acceso…</h2>
<p>Se limpiará la versión anterior y se abrirá Reporte Docente EPOANT.</p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    try{localStorage.clear();}catch(e){}
    try{sessionStorage.clear();}catch(e){}
  }catch(e){}
  setTimeout(()=>location.replace("https://script.google.com/macros/s/AKfycbwJYoL2ffc0LT_wqDduusHXPOCWIA5VWVKovMF5s2Jr1OL7m39htFF15vJ_C-qoWZQS/exec"),300);
})();
</script>
</body>
</html>
