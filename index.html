<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Reporte Docente EPOANT</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root{--navy:#123b66;--navy2:#0b2948;--gold:#d4a62a;--bg:#f4f7fb;--card:#fff;--text:#1d2733;--muted:#667085;--border:#dce3ec;--ok:#16794a;--danger:#b42318;--warn:#b54708;--shadow:0 8px 28px rgba(17,42,75,.10)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .loginShell{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,var(--navy2),var(--navy) 58%,#1c5f94)}
    .loginCard{width:min(460px,100%);background:white;border-radius:24px;padding:32px;box-shadow:0 24px 70px rgba(0,0,0,.22)}
    .brandMark{width:82px;height:82px;border-radius:20px;background:#fff;display:grid;place-items:center;margin-bottom:18px;border:1px solid var(--border);box-shadow:0 8px 20px rgba(17,42,75,.12);overflow:hidden}.brandMark img{width:72px;height:72px;object-fit:contain;display:block}
    h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 26px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:#344054}.input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 13px;background:white;outline:none}.input:focus{border-color:#78a7d4;box-shadow:0 0 0 3px rgba(56,125,190,.12)}
    .btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800}.btnPrimary{background:var(--navy);color:white}.btnPrimary:hover{background:var(--navy2)}.btnGold{background:var(--gold);color:#1f2a36}.btnLight{background:#eef3f8;color:var(--navy)}.btnDanger{background:#fff0ef;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.full{width:100%}
    .status{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px}.status.ok{background:#ecfdf3;color:var(--ok)}.status.err{background:#fef3f2;color:var(--danger)}
    .app{min-height:100vh}.topbar{height:70px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.topBrand{display:flex;align-items:center;gap:12px;font-weight:900;color:var(--navy)}.miniMark{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;border:1px solid var(--border);overflow:hidden}.miniMark img{width:40px;height:40px;object-fit:contain;display:block}.userBox{text-align:right}.userBox b{display:block}.userBox small{color:var(--muted)}
    .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}.sidebar{background:var(--navy2);padding:22px 14px;color:white;position:sticky;top:70px;height:calc(100vh - 70px)}.navBtn{width:100%;border:0;background:transparent;color:#dbe8f4;text-align:left;padding:12px 13px;border-radius:10px;margin:4px 0;font-weight:700}.navBtn:hover,.navBtn.active{background:rgba(255,255,255,.12);color:white}.navBtn.logout{margin-top:22px;color:#ffd3d0}
    .main{padding:26px;max-width:1400px;width:100%;margin:0 auto}.pageHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.pageHead h2{margin:0;font-size:25px}.pageHead p{margin:5px 0 0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}.stat{background:white;border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:30px;margin-top:4px;color:var(--navy)}
    .card{background:white;border:1px solid var(--border);border-radius:17px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.areaGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.areaBtn{border:1px solid var(--border);background:white;border-radius:12px;padding:13px 8px;font-weight:800;color:#344054}.areaBtn.sel{border-color:var(--navy);background:#edf5fc;color:var(--navy)}
    .reportList{display:grid;gap:12px}.report{background:white;border:1px solid var(--border);border-left:5px solid #98a2b3;border-radius:14px;padding:16px}.report.URGENTE{border-left-color:var(--danger)}.report.IMPORTANTE{border-left-color:var(--warn)}.report.POSITIVO{border-left-color:var(--ok)}.reportTop{display:flex;justify-content:space-between;gap:12px}.report h3{font-size:16px;margin:0 0 5px}.meta{font-size:13px;color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;border-radius:999px;padding:5px 8px;background:#eef3f8;color:#344054;font-weight:700}.chip.red{background:#fef3f2;color:var(--danger)}.chip.green{background:#ecfdf3;color:var(--ok)}.reportActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.smallBtn{border:0;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:800;background:#eef3f8;color:var(--navy)}
    .filters{display:grid;grid-template-columns:1fr 1fr 1fr 2fr auto;gap:10px}.empty{text-align:center;color:var(--muted);padding:36px 10px}.teacherRow{display:grid;grid-template-columns:minmax(210px,2fr) minmax(150px,1fr) minmax(120px,.8fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);align-items:center}.teacherMain small,.teacherMeta{display:block;color:var(--muted);font-size:12px;margin-top:4px}.teacherActions{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}.teacherState{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#edf7ef;color:#20733b}.teacherState.off{background:#fcebec;color:#a12b34}.tempPass{font-size:21px;font-weight:900;padding:12px 14px;border:1px dashed var(--blue);border-radius:12px;background:#f7fbff;text-align:center;word-break:break-all}
    .modalBack{position:fixed;inset:0;background:rgba(5,20,35,.55);display:grid;place-items:center;padding:20px;z-index:100}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.modal h3{margin-top:0}.modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
    .notice{padding:12px 14px;border-radius:12px;background:#fff8e7;color:#7a5000;margin-bottom:14px;font-size:14px}

    .quickFilters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quickFilter{border:1px solid var(--border);background:#fff;color:#344054;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.quickFilter:hover,.quickFilter.active{background:#edf5fc;border-color:#8bb5dc;color:var(--navy)}
    .alertList{display:grid;gap:10px}.alertRow{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(4,minmax(75px,.5fr)) auto;gap:10px;align-items:center;border:1px solid var(--border);border-left:5px solid var(--warn);border-radius:13px;padding:13px 14px;background:#fff}.alertRow.URGENTE{border-left-color:var(--danger)}.alertName{font-weight:900;color:#1d2733}.alertMeta{font-size:12px;color:var(--muted);margin-top:3px}.alertMetric{text-align:center}.alertMetric strong{display:block;font-size:18px;color:var(--navy)}.alertMetric span{font-size:11px;color:var(--muted)}
    .summaryGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:13px 0}.summaryMini{border:1px solid var(--border);border-radius:12px;padding:11px;background:#f9fbfd;text-align:center}.summaryMini strong{display:block;font-size:22px;color:var(--navy)}.summaryMini span{font-size:11px;color:var(--muted)}.timeline{display:grid;gap:9px;margin-top:14px}.timelineItem{border-left:3px solid #b9c7d7;padding:8px 10px;background:#f8fafc;border-radius:0 10px 10px 0}.timelineItem b{display:block;font-size:13px}.timelineItem small{color:var(--muted)}
    @media(max-width:980px){.stats{grid-template-columns:1fr 1fr}.alertRow{grid-template-columns:1fr 1fr 1fr}.alertRow .alertMain{grid-column:1/-1}.summaryGrid{grid-template-columns:1fr 1fr}.areaGrid{grid-template-columns:1fr 1fr 1fr}.grid3{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;display:flex;padding:8px;z-index:50;overflow:auto;border-top:1px solid rgba(255,255,255,.15)}.navBtn{min-width:112px;text-align:center;padding:10px 7px;margin:0 3px;font-size:12px}.navBtn.logout{margin-top:0}.main{padding:20px 18px 92px}.topbar{padding:0 16px}.userBox small{display:none}}
    @media(max-width:640px){.alertRow{grid-template-columns:1fr 1fr}.alertRow .alertMain{grid-column:1/-1}.summaryGrid{grid-template-columns:1fr 1fr}.loginCard{padding:24px 20px}.topbar{height:62px}.layout{min-height:calc(100vh - 62px)}.main{padding:17px 13px 92px}.pageHead{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.grid2{grid-template-columns:1fr}.areaGrid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.reportTop{flex-direction:column}.teacherRow{grid-template-columns:1fr}.topBrand span{display:none}}
  </style>
</head>

  if(!origenRespuestaValido(event.origin)) return;
  const data=event.data;
  if(!data || data.__rd_rpc!==true || !data.requestId) return;

  const pendiente=RPC_PENDIENTES.get(data.requestId);
  if(!pendiente) return;

  clearTimeout(pendiente.timer);
  RPC_PENDIENTES.delete(data.requestId);
  try{pendiente.frame.remove();}catch(e){}
  pendiente.resolve(data.result);
});

function rpc(accion,payload={}){
  return new Promise((resolve,reject)=>{
    const requestId=idRpc();
    const frame=document.createElement('iframe');
    const frameName='rd_rpc_'+requestId.replace(/[^a-zA-Z0-9_]/g,'');
    frame.name=frameName;
    frame.setAttribute('aria-hidden','true');
    frame.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px;top:-9999px;';
    document.body.appendChild(frame);

    const form=document.createElement('form');
    form.method='POST';
    form.action=API_URL;
    form.target=frameName;
    form.acceptCharset='UTF-8';
    form.style.display='none';

    const campos={
      accion:String(accion||''),
      payload:JSON.stringify(payload||{}),
      requestId:requestId
    };

    Object.keys(campos).forEach(nombre=>{
      const input=document.createElement('input');
      input.type='hidden';
      input.name=nombre;
      input.value=campos[nombre];
      form.appendChild(input);
    });

    document.body.appendChild(form);

    const timer=setTimeout(()=>{
      RPC_PENDIENTES.delete(requestId);
      try{form.remove();}catch(e){}
      try{frame.remove();}catch(e){}
      reject(new Error('El servidor tardó demasiado en responder. Intenta nuevamente.'));
    },35000);

    RPC_PENDIENTES.set(requestId,{resolve,reject,frame,timer});

    try{
      form.submit();
      form.remove();
    }catch(e){
      clearTimeout(timer);
      RPC_PENDIENTES.delete(requestId);
      try{form.remove();}catch(x){}
      try{frame.remove();}catch(x){}
      reject(e);
    }
  });
}

}

function modalRestablecerDocente(id){
  let d=null; for(let i=0;i<DOCENTES_CACHE.length;i++){if(DOCENTES_CACHE[i].id===id){d=DOCENTES_CACHE[i];break;}}
  if(!d)return;
  modal('<h3>Restablecer contraseña</h3><p>Se generará una nueva contraseña temporal para <b>'+esc(d.nombre)+'</b>.</p><div class="notice">La contraseña anterior dejará de funcionar. Al iniciar sesión, el docente deberá establecer una nueva.</div><div id="resetMsg"></div><div class="modalActions"><button class="btn btnLight" onclick="cerrarModal()">Cancelar</button><button id="resetBtn" class="btn btnPrimary" onclick="ejecutarRestablecimiento(\''+esc(id)+'\')">🔑 Restablecer contraseña</button></div>');
}

async function ejecutarRestablecimiento(id){
  const b=document.getElementById('resetBtn'); loading(b,true,'Restableciendo...');
  try{
    const r=await rpc('restablecerClaveDocente',{token:TOKEN,docenteId:id});
    if(!r || !r.ok){msg(document.getElementById('resetMsg'),(r&&r.mensaje)||'No fue posible restablecer.','err');return;}
    const estado=r.docente.activo==='SI'?'':'<div class="status err">La cuenta está desactivada. Actívala antes de que el docente intente ingresar.</div>';
    modal('<h3>Contraseña restablecida</h3><div class="status ok">'+esc(r.mensaje)+'</div><p><b>'+esc(r.docente.nombre)+'</b><br>Usuario: <b id="resetUser">'+esc(r.docente.usuario)+'</b></p><label>Contraseña temporal</label><div id="tempPass" class="tempPass">'+esc(r.claveTemporal)+'</div>'+estado+'<div class="modalActions"><button class="btn btnLight" onclick="copiarTemporal()">📋 Copiar acceso</button><button class="btn btnPrimary" onclick="cerrarModal();cargarDocentes()">Listo</button></div>');
  }catch(e){msg(document.getElementById('resetMsg'),e.message,'err');}
  finally{loading(b,false,'🔑 Restablecer contraseña');}
}

function copiarTemporal(){
  const passEl=document.getElementById('tempPass'); const userEl=document.getElementById('resetUser');
  const pass=passEl?passEl.textContent:''; const usuario=userEl?userEl.textContent:'';
  const texto='Reporte Docente EPOANT\nUsuario: '+usuario+'\nContraseña temporal: '+pass+'\nAl ingresar deberá crear una nueva contraseña.';
  if(navigator.clipboard && navigator.clipboard.writeText){navigator.clipboard.writeText(texto).then(function(){alert('Acceso copiado.');}).catch(function(){alert(texto);});} else {alert(texto);}
}

async function cambiarEstadoDocente(id,activo){
  try{
    const r=await rpc('cambiarEstadoDocente',{token:TOKEN,docenteId:id,activo:activo});
    if(!r || !r.ok){alert((r&&r.mensaje)||'No fue posible actualizar la cuenta.');return;}
    await cargarDocentes();
  }catch(e){alert(e.message);}
}

function renderCuenta(){
  const sec=document.getElementById('viewCuenta');
  sec.innerHTML=`<div class="pageHead"><div><h2>Cuenta y mantenimiento</h2><p>Opciones personales y administrativas.</p></div></div><div class="grid2"><div class="card"><h3>Cambiar contraseña</h3><div class="field"><label>Contraseña actual</label><input id="pwActual" type="password" class="input"></div><div class="field"><label>Nueva contraseña</label><input id="pwNueva" type="password" class="input"></div><button class="btn btnPrimary" onclick="cambiarClave()">Actualizar</button><div id="pwMsg"></div></div>${USER.rol!=='DOCENTE'?`<div class="card"><h3>Sincronizar alumnos</h3><p class="sub">Actualiza Primero 1 y Primero 2 desde Datos de Identificación.</p><button id="syncBtn" class="btn btnGold" onclick="syncAlumnos()">Sincronizar ahora</button><div id="syncMsg"></div></div>`:''}</div>`;
}
async function cambiarClave(){const r=await rpc('cambiarClave',{token:TOKEN,actual:document.getElementById('pwActual').value,nueva:document.getElementById('pwNueva').value});msg(document.getElementById('pwMsg'),r.mensaje,r.ok?'ok':'err');if(r.ok){document.getElementById('pwActual').value='';document.getElementById('pwNueva').value='';}}
async function syncAlumnos(){const b=document.getElementById('syncBtn');loading(b,true,'Sincronizando...');try{const r=await rpc('sincronizarAlumnos',{token:TOKEN});msg(document.getElementById('syncMsg'),r.ok?`Listo: ${r.total} alumnos (${r.primero1} de Primero 1 y ${r.primero2} de Primero 2).`:r.mensaje,r.ok?'ok':'err');if(r.ok){await cargarApp();abrir('cuenta')}}catch(e){msg(document.getElementById('syncMsg'),e.message,'err')}finally{loading(b,false,'Sincronizar ahora')}}

function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalBack" onclick="if(event.target===this)cerrarModal()"><div class="modal">${html}</div></div>`}
function cerrarModal(){document.getElementById('modalRoot').innerHTML=''}

window.entrar=entrar;
document.getElementById('loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
(async function inicio(){if(!TOKEN)return;try{await cargarApp()}catch(e){sessionStorage.clear();TOKEN='';}})();
</script>
</body>
</html>
