<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#061523">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reporte Docente EPOANT</title>
  <link rel="icon" href="favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#061523}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;color:#fff}
    .card{width:min(440px,100%);text-align:center}
    .logo{width:110px;height:110px;object-fit:contain;margin:0 auto 18px;display:block}
    h1{font-size:24px;margin:0 0 8px}
    p{margin:0;color:#d7e0e8;line-height:1.45}
    .spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;
      margin:22px auto;animation:s .75s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    a{display:inline-block;margin-top:10px;padding:12px 18px;background:#fff;color:#061523;border-radius:10px;
      text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img src="logo-epoant.png" class="logo" alt="Logo EPOANT">
    <h1>Reporte Docente EPOANT</h1>
    <p>Abriendo el sistema de Orientación Educativa…</p>
    <div class="spin" aria-hidden="true"></div>
    <a href="https://script.google.com/macros/s/AKfycbwJYoL2ffc0LT_wqDduusHXPOCWIA5VWVKovMF5s2Jr1OL7m39htFF15vJ_C-qoWZQS/exec">Abrir sistema</a>
  </main>

  <script>
    (async function () {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch (e) {}
      window.location.replace("https://script.google.com/macros/s/AKfycbwJYoL2ffc0LT_wqDduusHXPOCWIA5VWVKovMF5s2Jr1OL7m39htFF15vJ_C-qoWZQS/exec");
    })();
  </script>
</body>
</html>
