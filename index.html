<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061523">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Reporte Docente EPOANT</title>
  <link rel="icon" href="favicon.png">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061523}
    body{min-height:100dvh}
    #app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#fff}
    #loader{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(145deg,#061523,#0d3150);color:#fff;font-family:Arial,Helvetica,sans-serif;
      padding:24px;transition:opacity .25s ease,visibility .25s ease}
    #loader.oculto{opacity:0;visibility:hidden}
    .box{text-align:center;max-width:430px}
    .logo{width:100px;height:100px;object-fit:contain;margin:0 auto 18px;display:block}
    h1{margin:0 0 8px;font-size:23px}
    p{margin:0;color:#d7e0e8;line-height:1.45;font-size:14px}
    .spin{width:34px;height:34px;margin:20px auto 0;border:4px solid rgba(255,255,255,.22);
      border-top-color:#fff;border-radius:50%;animation:s .75s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    #fallback{display:none;margin-top:18px;font-size:13px}
    #fallback.mostrar{display:block}
    #fallback a{color:#fff;font-weight:700}
  </style>
</head>
<body>
  <div id="loader">
    <div class="box">
      <img src="logo-epoant.png" class="logo" alt="Logo EPOANT">
      <h1>Reporte Docente EPOANT</h1>
      <p>Cargando el sistema de Orientación Educativa…</p>
      <div class="spin" aria-hidden="true"></div>
      <div id="fallback">
        Si tarda demasiado, <a href="https://script.google.com/macros/s/AKfycbwJYoL2ffc0LT_wqDduusHXPOCWIA5VWVKovMF5s2Jr1OL7m39htFF15vJ_C-qoWZQS/exec" target="_blank" rel="noopener">abrir directamente</a>.
      </div>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbwJYoL2ffc0LT_wqDduusHXPOCWIA5VWVKovMF5s2Jr1OL7m39htFF15vJ_C-qoWZQS/exec"
    title="Reporte Docente EPOANT"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script>
    const app = document.getElementById('app');
    const loader = document.getElementById('loader');
    const fallback = document.getElementById('fallback');

    app.addEventListener('load', () => {
      setTimeout(() => loader.classList.add('oculto'), 300);
    });

    setTimeout(() => {
      if (!loader.classList.contains('oculto')) {
        fallback.classList.add('mostrar');
      }
    }, 8000);
  </script>
</body>
</html>
