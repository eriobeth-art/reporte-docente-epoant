<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061523">
  <meta name="description" content="Reporte Docente EPOANT">
  <title>Reporte Docente EPOANT</title>

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="loader-card">
      <img class="loader-logo" src="assets/logo-epoant.png" alt="Logo EPOANT">
      <div class="loader-title">Reporte Docente EPOANT</div>
      <div class="loader-sub">Escuela Preparatoria Oficial Anexa a la Normal de Tejupilco · Turno Matutino</div>
      <div class="spinner" aria-hidden="true"></div>
      <div id="fallback" class="fallback">
        Si la aplicación tarda en abrir, <a id="directLink" target="_blank" rel="noopener">abrir directamente</a>.
      </div>
    </div>
  </div>

  <iframe
    id="appFrame"
    title="Reporte Docente EPOANT"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>

  <script src="assets/config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
